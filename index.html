<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber City Manager - Victory & Defeat Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #050608;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: #00f0ff;
    }
    #game-container {
      position: relative;
      width: 1000px;
      height: 600px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
      border: 1px solid #00f0ff;
    }
    body::after {
  content: " ";
  display: block;
  position: fixed;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  z-index: 99999;
  background-size: 100% 2px, 3px 100%;
  pointer-events: none;
}
  </style>

</head>
  <script src="audio-fx.js"></script>
<body>

<div id="game-container"></div>

<script>
class CyberAudio {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  playClickSound() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }

  playSuccessSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.setValueAtTime(500, now + 0.1);
    osc.frequency.setValueAtTime(800, now + 0.2);
    osc.frequency.setValueAtTime(1200, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.45);
  }

  playAlarmSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.setValueAtTime(100, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.3);
  }
}

const sfx = new CyberAudio();

class CityManagerScene extends Phaser.Scene {
  constructor() {
    super({ key: 'CityManagerScene' });
  }

  init() {
    this.pulseTimer = 0;
    this.gameOver = false;

    const defaultBuildings = [
      { id: 1, name: 'Data Center Alpha', isoX: 250, isoY: 350, w: 70, h: 90, color: 0x00f0ff, level: 1, cost: 200, income: 15, pcBoost: 15, mobileBoost: 10, requiresHack: false },
      { id: 2, name: 'Telecom Array',    isoX: 450, isoY: 420, w: 60, h: 120, color: 0xffaa00, level: 0, cost: 450, income: 35, pcBoost: 20, mobileBoost: 35, requiresHack: true },
      { id: 3, name: 'Security Hub',     isoX: 700, isoY: 320, w: 80, h: 110, color: 0xff0055, level: 0, cost: 800, income: 75, pcBoost: 30, mobileBoost: 20, requiresHack: true },
      { id: 4, name: 'Mainframe Vault',  isoX: 850, isoY: 480, w: 90, h: 140, color: 0x00ffaa, level: 0, cost: 1500, income: 180, pcBoost: 35, mobileBoost: 35, requiresHack: true }
    ];

    const savedData = localStorage.getItem('CYBER_CITY_SAVE');
    if (savedData) {
      try {
        const parsed = JSON.parse(savedData);
        this.money = parsed.money;
        this.pcPercent = parsed.pcPercent;
        this.mobilePercent = parsed.mobilePercent;
        this.daysPassed = parsed.daysPassed;
        this.threatLevel = parsed.threatLevel || 0;
        this.isLockdown = parsed.isLockdown || false;
        
        this.buildings = defaultBuildings.map(b => {
          const savedB = parsed.buildings.find(sb => sb.id === b.id);
          if (savedB) {
            return { ...b, level: savedB.level, requiresHack: savedB.requiresHack };
          }
          return b;
        });
      } catch (e) {
        this.loadDefaults(defaultBuildings);
      }
    } else {
      this.loadDefaults(defaultBuildings);
    }
  }

  loadDefaults(defaultBuildings) {
    this.money = 500;
    this.pcPercent = 12;
    this.mobilePercent = 25;
    this.daysPassed = 1;
    this.threatLevel = 0;
    this.isLockdown = false;
    this.buildings = defaultBuildings;
  }

  saveGameData() {
    if (this.gameOver) return;
    const saveData = {
      money: this.money,
      pcPercent: this.pcPercent,
      mobilePercent: this.mobilePercent,
      daysPassed: this.daysPassed,
      threatLevel: this.threatLevel,
      isLockdown: this.isLockdown,
      buildings: this.buildings.map(b => ({ id: b.id, level: b.level, requiresHack: b.requiresHack }))
    };
    localStorage.setItem('CYBER_CITY_SAVE', JSON.stringify(saveData));
  }

  resetGameData() {
    localStorage.removeItem('CYBER_CITY_SAVE');
    this.scene.restart();
  }

  create() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    this.cameras.main.setBackgroundColor('#05070a');
    this.input.once('pointerdown', () => sfx.init());

    this.gridGraphics = this.add.graphics();

    const pGraphic = this.make.graphics({x: 0, y: 0, add: false});
    pGraphic.fillStyle(0x00f0ff, 1);
    pGraphic.fillCircle(4, 4, 4);
    pGraphic.generateTexture('glowDot', 8, 8);

    this.emitter = this.add.particles(0, 0, 'glowDot', {
      speed: { min: 80, max: 200 },
      angle: { min: 0, max: 360 },
      scale: { start: 1.5, end: 0 },
      blendMode: 'ADD',
      lifespan: 800,
      emitting: false
    });

    this.renderBuildings();
    this.createHUD(width);

    this.economyTimer = this.time.addEvent({
      delay: 2000,
      callback: this.processEconomyTick,
      callbackScope: this,
      loop: true
    });
  }

  update(time, delta) {
    this.pulseTimer += delta * 0.002;
    const alphaPulse = 0.3 + Math.sin(this.pulseTimer) * 0.2;
    
    this.gridGraphics.clear();
    this.gridGraphics.lineStyle(1, this.isLockdown ? 0xff0055 : 0x00f0ff, alphaPulse);

    for (let x = -400; x < 1400; x += 50) {
      this.gridGraphics.beginPath();
      this.gridGraphics.moveTo(x, 0);
      this.gridGraphics.lineTo(x + 600, 600);
      this.gridGraphics.strokePath();

      this.gridGraphics.beginPath();
      this.gridGraphics.moveTo(x, 600);
      this.gridGraphics.lineTo(x + 600, 0);
      this.gridGraphics.strokePath();
    }
  }

  renderBuildings() {
    this.buildings.forEach(b => {
      const g = this.add.graphics();
      const activeColor = b.level > 0 ? b.color : 0x223344;

      g.fillStyle(0x0c1117, 0.95);
      g.fillTriangle(b.isoX, b.isoY, b.isoX - b.w, b.isoY - b.w/2, b.isoX, b.isoY - b.w);
      g.fillStyle(0x080d12, 0.95);
      g.fillTriangle(b.isoX, b.isoY, b.isoX + b.w, b.isoY - b.w/2, b.isoX, b.isoY - b.w);

      g.fillStyle(0x131d28, 0.95);
      g.fillTriangle(b.isoX, b.isoY - b.h, b.isoX - b.w, b.isoY - b.h - b.w/2, b.isoX, b.isoY - b.h - b.w);
      g.fillTriangle(b.isoX, b.isoY - b.h, b.isoX + b.w, b.isoY - b.h - b.w/2, b.isoX, b.isoY - b.h - b.w);

      g.lineStyle(2, activeColor, b.level > 0 ? 1 : 0.4);
      g.strokeLineShape(new Phaser.Geom.Line(b.isoX, b.isoY - b.h, b.isoX - b.w, b.isoY - b.h - b.w/2));
      g.strokeLineShape(new Phaser.Geom.Line(b.isoX, b.isoY - b.h, b.isoX + b.w, b.isoY - b.h + b.w/2));
      g.strokeLineShape(new Phaser.Geom.Line(b.isoX, b.isoY - b.h - b.w, b.isoX - b.w, b.isoY - b.h - b.w/2));
      g.strokeLineShape(new Phaser.Geom.Line(b.isoX, b.isoY - b.h - b.w, b.isoX + b.w, b.isoY - b.h - b.w/2));

      const hitArea = new Phaser.Geom.Polygon([
        b.isoX, b.isoY - b.h - b.w,
        b.isoX + b.w, b.isoY - b.h - b.w/2,
        b.isoX + b.w, b.isoY - b.w/2,
        b.isoX, b.isoY,
        b.isoX - b.w, b.isoY - b.w/2,
        b.isoX - b.w, b.isoY - b.h - b.w/2
      ]);

      const hitZone = this.add.zone(0, 0, 1, 1).setInteractive(hitArea, Phaser.Geom.Polygon.Contains);
      hitZone.on('pointerdown', () => {
        if (this.gameOver) return;
        sfx.playClickSound();
        this.openBuildingPanel(b);
      });

      this.add.text(b.isoX - 20, b.isoY - b.h - b.w - 20, `LVL ${b.level}`, {
        font: 'bold 12px Courier',
        fill: b.level > 0 ? '#00f0ff' : '#556677',
        shadow: { color: b.level > 0 ? '#00f0ff' : '#000000', blur: 8, fill: true }
      });
    });
  }

  createHUD(width) {
    const hud = this.add.graphics();
    hud.fillStyle(0x06080d, 0.9);
    hud.fillRect(0, 0, width, 55);
    hud.lineStyle(2, 0x00f0ff, 0.5);
    hud.strokeLineShape(new Phaser.Geom.Line(0, 55, width, 55));

    this.pcText = this.add.text(20, 18, '', { font: '14px Courier', fill: '#00f0ff' });
    this.mobileText = this.add.text(170, 18, '', { font: '14px Courier', fill: '#00ffaa' });
    this.threatText = this.add.text(320, 18, '', { font: 'bold 14px Courier', fill: '#ff0055' });

    this.moneyText = this.add.text(width - 220, 16, '', { font: 'bold 18px Courier', fill: '#ffaa00' });
    this.daysText = this.add.text(width - 340, 18, '', { font: '14px Courier', fill: '#ffffff' });

    const purgeBtn = this.add.text(width - 150, 15, 'CLEAR TRACES ($100S)', {
      font: 'bold 11px Courier',
      fill: '#00f0ff',
      backgroundColor: '#112233',
      padding: { x: 6, y: 5 }
    }).setInteractive({ useHandCursor: true });

    purgeBtn.on('pointerdown', () => {
      if (this.gameOver) return;
      sfx.playClickSound();
      if (this.money >= 100 && this.threatLevel > 0) {
        this.money -= 100;
        this.threatLevel = 0;
        this.isLockdown = false;
        sfx.playSuccessSound();
        this.saveGameData();
        this.updateHUDText();
      }
    });

    const resetBtn = this.add.text(width - 50, 15, 'RESET', {
      font: 'bold 11px Courier',
      fill: '#ffffff',
      backgroundColor: '#ff0055',
      padding: { x: 6, y: 5 }
    }).setInteractive({ useHandCursor: true });

    resetBtn.on('pointerdown', () => {
      if (confirm("Reset game progress and restart?")) {
        this.resetGameData();
      }
    });

    this.updateHUDText();
  }

  updateHUDText() {
    this.pcText.setText(`💻 PC: ${this.pcPercent}%`);
    this.mobileText.setText(`📱 MOBILE: ${this.mobilePercent}%`);
    
    if (this.isLockdown) {
      this.threatText.setText(`⚠️ LOCKDOWN! (100%)`).setColor('#ff0055');
    } else {
      this.threatText.setText(`🛡️ THREAT: ${this.threatLevel}%`).setColor(this.threatLevel > 70 ? '#ff5500' : '#00f0ff');
    }

    this.moneyText.setText(`$ ${this.money}S`);
    this.daysText.setText(`DAY ${this.daysPassed}`);
  }

  processEconomyTick() {
    if (this.gameOver) return;

    this.daysPassed += 1;

    if (!this.isLockdown) {
      this.threatLevel = Math.min(100, this.threatLevel + 2);
      if (this.threatLevel >= 100) {
        this.isLockdown = true;
        sfx.playAlarmSound();
      }
    }

    if (!this.isLockdown) {
      let incomeGenerated = 0;
      this.buildings.forEach(b => {
        if (b.level > 0) incomeGenerated += b.income * b.level;
      });
      this.money += incomeGenerated;
    }

    this.updateHUDText();
    this.checkGameConditions();
  }

  checkGameConditions() {
    // VICTORY: Reached 100% on both networks
    if (this.pcPercent >= 100 && this.mobilePercent >= 100) {
      this.triggerEndScreen(true);
    }
    // DEFEAT: Locked down with less than $100S to purge traces
    else if (this.isLockdown && this.money < 100) {
      this.triggerEndScreen(false);
    }
  }

  triggerEndScreen(isWin) {
    this.gameOver = true;
    if (this.economyTimer) this.economyTimer.remove();

    const overlay = this.add.graphics();
    overlay.fillStyle(0x000000, 0.85);
    overlay.fillRect(0, 0, 1000, 600);

    const titleColor = isWin ? '#00ffaa' : '#ff0055';
    const titleText = isWin ? 'SYSTEM OVERRIDE SUCCESSFUL' : 'NETWORK LOCKDOWN TERMINATED';
    const descText = isWin ? 
      `CONGRATULATIONS OPERATIVE!\nYou achieved 100% PC and Mobile network control in ${this.daysPassed} days!` :
      `CRITICAL BREACH DETECTED!\nSystem locked at 100% Threat with insufficient credits ($${this.money}S) to clear traces.`;

    this.add.text(500, 200, titleText, {
      font: 'bold 24px Courier',
      fill: titleColor
    }).setOrigin(0.5);

    this.add.text(500, 280, descText, {
      font: '14px Courier',
      fill: '#ffffff',
      align: 'center',
      lineSpacing: 8
    }).setOrigin(0.5);

    const restartBtn = this.add.text(500, 380, ' RESTART SYSTEM ', {
      font: 'bold 16px Courier',
      fill: '#000000',
      backgroundColor: titleColor,
      padding: { x: 15, y: 10 }
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

    restartBtn.on('pointerdown', () => {
      this.resetGameData();
    });
  }

  openBuildingPanel(building) {
    if (this.panelContainer) this.panelContainer.destroy();

    const centerX = 500;
    const centerY = 300;

    const panelBg = this.add.graphics();
    panelBg.fillStyle(0x040609, 0.95);
    panelBg.fillRect(-180, -120, 360, 240);
    panelBg.lineStyle(2, building.color, 1);
    panelBg.strokeRect(-180, -120, 360, 240);

    const title = this.add.text(-160, -100, building.name.toUpperCase(), {
      font: 'bold 16px Courier',
      fill: '#ffffff'
    });

    const info = this.add.text(-160, -60, 
      `LEVEL: ${building.level}\n` +
      `INCOME: +$${building.income * (building.level || 1)}S / tick\n` +
      `PC CONTROL: +${building.pcBoost}%\n` +
      `MOBILE NETWORK: +${building.mobileBoost}%`, {
      font: '13px Courier',
      fill: '#88aacc',
      lineSpacing: 6
    });

    const upgradeCost = building.cost * (building.level + 1);
    const canAfford = this.money >= upgradeCost && !this.isLockdown;

    const btnBg = this.add.graphics();
    btnBg.fillStyle(canAfford ? (building.requiresHack ? 0xff0055 : 0x00f0ff) : 0x223344, 1);
    btnBg.fillRect(-160, 40, 320, 40);

    const btnTextStr = this.isLockdown ? 'SYSTEM IN LOCKDOWN!' : (building.requiresHack ? `HACK SECURITY ($${upgradeCost}S)` : `UPGRADE / BUY ($${upgradeCost}S)`);

    const btnText = this.add.text(-140, 52, btnTextStr, {
      font: 'bold 12px Courier',
      fill: canAfford ? '#ffffff' : '#888888'
    });

    const btnZone = this.add.zone(-160, 40, 320, 40).setOrigin(0).setInteractive({ useHandCursor: true });
    btnZone.on('pointerdown', () => {
      if (canAfford) {
        if (building.requiresHack) {
          this.panelContainer.destroy();
          this.openHackMinigame(building, upgradeCost);
        } else {
          this.buyBuildingUpgrade(building, upgradeCost);
        }
      }
    });

    const closeBtn = this.add.text(150, -110, '✕', {
      font: '18px Courier',
      fill: '#ffffff'
    }).setInteractive({ useHandCursor: true });

    closeBtn.on('pointerdown', () => {
      sfx.playClickSound();
      this.panelContainer.destroy();
    });

    this.panelContainer = this.add.container(centerX, centerY, [
      panelBg, title, info, btnBg, btnText, btnZone, closeBtn
    ]);
  }

  openHackMinigame(building, cost) {
    const centerX = 500;
    const centerY = 300;

    const inputs = { L1: 0, L2: 0, L3: 0, R1: 0, R2: 0, R3: 0 };
    const hackContainer = this.add.container(centerX, centerY);

    const panelBg = this.add.graphics();
    panelBg.fillStyle(0x040608, 0.98);
    panelBg.fillRect(-220, -170, 440, 340);
    panelBg.lineStyle(2, 0x00f0ff, 1);
    panelBg.strokeRect(-220, -170, 440, 340);

    const title = this.add.text(-200, -150, `HACK SYSTEM: ${building.name.toUpperCase()}`, {
      font: 'bold 14px Courier',
      fill: '#ff0055'
    });

    const outputText = this.add.text(-40, 110, 'HACK: 0', {
      font: 'bold 20px Courier',
      fill: '#ff0055'
    });

    const drawCircuit = () => {
      const leftOR = inputs.L1 || inputs.L2 ? 1 : 0;
      const leftAND = inputs.L2 && inputs.L3 ? 1 : 0;
      const leftCentralAND = leftOR && leftAND ? 1 : 0;

      const rightAND = inputs.R1 && inputs.R2 ? 1 : 0;
      const rightOR = inputs.R2 || inputs.R3 ? 1 : 0;
      const rightCentralOR = rightAND || rightOR ? 1 : 0;

      const finalHACK = leftCentralAND || rightCentralOR ? 1 : 0;

      if (finalHACK === 1) {
        outputText.setText('HACK: 1 (SUCCESS)').setColor('#00ffaa');
      } else {
        outputText.setText('HACK: 0 (LOCKED)').setColor('#ff0055');
      }

      return finalHACK;
    };

    const createInputNode = (x, y, key) => {
      const nodeText = this.add.text(x - 10, y - 10, `${key}: 0`, {
        font: 'bold 12px Courier',
        fill: '#00f0ff',
        backgroundColor: '#112233',
        padding: { x: 4, y: 4 }
      }).setInteractive({ useHandCursor: true });

      nodeText.on('pointerdown', () => {
        sfx.playClickSound();
        inputs[key] = inputs[key] === 0 ? 1 : 0;
        nodeText.setText(`${key}: ${inputs[key]}`);
        nodeText.setBackgroundColor(inputs[key] === 1 ? '#00ffaa' : '#112233');
        nodeText.setColor(inputs[key] === 1 ? '#000000' : '#00f0ff');
        drawCircuit();
      });

      return nodeText;
    };

    const nL1 = createInputNode(-180, -90, 'L1');
    const nL2 = createInputNode(-180, -40, 'L2');
    const nL3 = createInputNode(-180, 10, 'L3');

    const nR1 = createInputNode(120, -90, 'R1');
    const nR2 = createInputNode(120, -40, 'R2');
    const nR3 = createInputNode(120, 10, 'R3');

    const g1 = this.add.text(-100, -65, '[OR]', { font: '12px Courier', fill: '#88aacc' });
    const g2 = this.add.text(-100, -15, '[AND]', { font: '12px Courier', fill: '#88aacc' });
    const g3 = this.add.text(40, -65, '[AND]', { font: '12px Courier', fill: '#88aacc' });
    const g4 = this.add.text(40, -15, '[OR]', { font: '12px Courier', fill: '#88aacc' });

    const execBtn = this.add.text(-100, 135, 'EXECUTE BREACH', {
      font: 'bold 16px Courier',
      fill: '#000000',
      backgroundColor: '#00f0ff',
      padding: { x: 15, y: 8 }
    }).setInteractive({ useHandCursor: true });

    execBtn.on('pointerdown', () => {
      const isBreached = drawCircuit();
      if (isBreached === 1) {
        sfx.playSuccessSound();
        building.requiresHack = false;
        
        this.threatLevel = Math.min(100, this.threatLevel + 20);
        if (this.threatLevel >= 100) this.isLockdown = true;

        this.buyBuildingUpgrade(building, cost);
        hackContainer.destroy();
      }
    });

    const closeBtn = this.add.text(190, -160, '✕', {
      font: '18px Courier',
      fill: '#ffffff'
    }).setInteractive({ useHandCursor: true });

    closeBtn.on('pointerdown', () => hackContainer.destroy());

    hackContainer.add([panelBg, title, outputText, nL1, nL2, nL3, nR1, nR2, nR3, g1, g2, g3, g4, execBtn, closeBtn]);
    drawCircuit();
  }

  buyBuildingUpgrade(building, cost) {
    if (this.money >= cost) {
      this.money -= cost;
      building.level += 1;
      this.pcPercent = Math.min(100, this.pcPercent + building.pcBoost);
      this.mobilePercent = Math.min(100, this.mobilePercent + building.mobileBoost);

      sfx.playSuccessSound();
      this.emitter.explode(25, building.isoX, building.isoY - building.h);

      this.saveGameData();
      this.updateHUDText();
      this.checkGameConditions();
      if (!this.gameOver) {
        this.scene.restart();
      }
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: 1000,
  height: 600,
  parent: 'game-container',
  scene: [CityManagerScene]
};

const game = new Phaser.Game(config);
</script>
