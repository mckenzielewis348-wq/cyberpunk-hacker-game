<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber City Manager - FX Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #050608;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: #00f0ff;
    }
    #game-container {
      position: relative;
      width: 1000px;
      height: 600px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
      border: 1px solid #00f0ff;
    }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>

<div id="game-container"></div>

<script>
// Web Audio Synthesizer Engine
class CyberAudio {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  playClickSound() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }

  playUpgradeSound() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.setValueAtTime(600, now + 0.08);
    osc.frequency.setValueAtTime(900, now + 0.16);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.3);
  }
}

const sfx = new CyberAudio();

class CityManagerScene extends Phaser.Scene {
  constructor() {
    super({ key: 'CityManagerScene' });
  }

  init() {
    this.money = 500;
    this.pcPercent = 12;
    this.mobilePercent = 25;
    this.daysPassed = 1;
    this.pulseTimer = 0;

    this.buildings = [
      { id: 1, name: 'Data Center Alpha', isoX: 250, isoY: 350, w: 70, h: 90, color: 0x00f0ff, level: 1, cost: 200, income: 15, pcBoost: 5, mobileBoost: 2 },
      { id: 2, name: 'Telecom Array',    isoX: 450, isoY: 420, w: 60, h: 120, color: 0xffaa00, level: 0, cost: 450, income: 35, pcBoost: 2, mobileBoost: 15 },
      { id: 3, name: 'Security Hub',     isoX: 700, isoY: 320, w: 80, h: 110, color: 0xff0055, level: 0, cost: 800, income: 75, pcBoost: 12, mobileBoost: 8 },
      { id: 4, name: 'Mainframe Vault',  isoX: 850, isoY: 480, w: 90, h: 140, color: 0x00ffaa, level: 0, cost: 1500, income: 180, pcBoost: 20, mobileBoost: 20 }
    ];
  }

  create() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    this.cameras.main.setBackgroundColor('#05070a');

    // Enable Web Audio on first user interaction
    this.input.once('pointerdown', () => sfx.init());

    // Grid Layer
    this.gridGraphics = this.add.graphics();
    
    // Create Neon Particle Texture Programmatically
    const pGraphic = this.make.graphics({x: 0, y: 0, add: false});
    pGraphic.fillStyle(0x00f0ff, 1);
    pGraphic.fillCircle(4, 4, 4);
    pGraphic.generateTexture('glowDot', 8, 8);

    // Particle Emitter Setup
    this.emitter = this.add.particles(0, 0, 'glowDot', {
      speed: { min: 80, max: 200 },
      angle: { min: 0, max: 360 },
      scale: { start: 1.5, end: 0 },
      blendMode: 'ADD',
      lifespan: 800,
      emitting: false
    });

    this.renderBuildings();
    this.createHUD(width);

    // Game Economy Cycle
    this.time.addEvent({
      delay: 2000,
      callback: this.processEconomyTick,
      callbackScope: this,
      loop: true
    });
  }

  update(time, delta) {
    // Pulsing Neon Grid Effect
    this.pulseTimer += delta * 0.002;
    const alphaPulse = 0.3 + Math.sin(this.pulseTimer) * 0.2;
    
    this.gridGraphics.clear();
    this.gridGraphics.lineStyle(1, 0x00f0ff, alphaPulse);

    for (let x = -400; x < 1400; x += 50) {
      this.gridGraphics.beginPath();
      this.gridGraphics.moveTo(x, 0);
      this.gridGraphics.lineTo(x + 600, 600);
      this.gridGraphics.strokePath();

      this.gridGraphics.beginPath();
      this.gridGraphics.moveTo(x, 600);
      this.gridGraphics.lineTo(x + 600, 0);
      this.gridGraphics.strokePath();
    }
  }

  renderBuildings() {
    this.buildings.forEach(b => {
      const g = this.add.graphics();
      const activeColor = b.level > 0 ? b.color : 0x223344;

      // Isometric Isometric Faces
      g.fillStyle(0x0c1117, 0.95);
      g.fillTriangle(b.isoX, b.isoY, b.isoX - b.w, b.isoY - b.w/2, b.isoX, b.isoY - b.w);
      g.fillStyle(0x080d12, 0.95);
      g.fillTriangle(b.isoX, b.isoY, b.isoX + b.w, b.isoY - b.w/2, b.isoX, b.isoY - b.w);

      // Roof Surface
      g.fillStyle(0x131d28, 0.95);
      g.fillTriangle(b.isoX, b.isoY - b.h, b.isoX - b.w, b.isoY - b.h - b.w/2, b.isoX, b.isoY - b.h - b.w);
      g.fillTriangle(b.isoX, b.isoY - b.h, b.isoX + b.w, b.isoY - b.h - b.w/2, b.isoX, b.isoY - b.h - b.w);

      // Neon Trim Outlines
      g.lineStyle(2, activeColor, b.level > 0 ? 1 : 0.4);
      g.strokeLineShape(new Phaser.Geom.Line(b.isoX, b.isoY - b.h, b.isoX - b.w, b.isoY - b.h - b.w/2));
      g.strokeLineShape(new Phaser.Geom.Line(b.isoX, b.isoY - b.h, b.isoX + b.w, b.isoY - b.h + b.w/2));
      g.strokeLineShape(new Phaser.Geom.Line(b.isoX, b.isoY - b.h - b.w, b.isoX - b.w, b.isoY - b.h - b.w/2));
      g.strokeLineShape(new Phaser.Geom.Line(b.isoX, b.isoY - b.h - b.w, b.isoX + b.w, b.isoY - b.h - b.w/2));

      // Clickable Hit Zone
      const hitArea = new Phaser.Geom.Polygon([
        b.isoX, b.isoY - b.h - b.w,
        b.isoX + b.w, b.isoY - b.h - b.w/2,
        b.isoX + b.w, b.isoY - b.w/2,
        b.isoX, b.isoY,
        b.isoX - b.w, b.isoY - b.w/2,
        b.isoX - b.w, b.isoY - b.h - b.w/2
      ]);

      const hitZone = this.add.zone(0, 0, 1, 1).setInteractive(hitArea, Phaser.Geom.Polygon.Contains);
      hitZone.on('pointerdown', () => {
        sfx.playClickSound();
        this.openBuildingPanel(b);
      });

      // Level Label with Glow
      this.add.text(b.isoX - 20, b.isoY - b.h - b.w - 20, `LVL ${b.level}`, {
        font: 'bold 12px Courier',
        fill: b.level > 0 ? '#00f0ff' : '#556677',
        shadow: { color: b.level > 0 ? '#00f0ff' : '#000000', blur: 8, fill: true }
      });
    });
  }

  createHUD(width) {
    const hud = this.add.graphics();
    hud.fillStyle(0x06080d, 0.9);
    hud.fillRect(0, 0, width, 55);
    hud.lineStyle(2, 0x00f0ff, 0.5);
    hud.strokeLineShape(new Phaser.Geom.Line(0, 55, width, 55));

    this.pcText = this.add.text(20, 18, '', { font: '14px Courier', fill: '#00f0ff' });
    this.mobileText = this.add.text(180, 18, '', { font: '14px Courier', fill: '#00ffaa' });
    this.moneyText = this.add.text(width - 180, 16, '', { font: 'bold 18px Courier', fill: '#ffaa00' });
    this.daysText = this.add.text(width - 320, 18, '', { font: '14px Courier', fill: '#ffffff' });

    this.updateHUDText();
  }

  updateHUDText() {
    this.pcText.setText(`💻 PC: ${this.pcPercent}%`);
    this.mobileText.setText(`📱 MOBILE: ${this.mobilePercent}%`);
    this.moneyText.setText(`$ ${this.money}S`);
    this.daysText.setText(`DAY ${this.daysPassed}`);
  }

  processEconomyTick() {
    this.daysPassed += 1;
    let incomeGenerated = 0;
    this.buildings.forEach(b => {
      if (b.level > 0) incomeGenerated += b.income * b.level;
    });

    this.money += incomeGenerated;
    this.updateHUDText();
  }

  openBuildingPanel(building) {
    if (this.panelContainer) this.panelContainer.destroy();

    const centerX = 500;
    const centerY = 300;

    const panelBg = this.add.graphics();
    panelBg.fillStyle(0x040609, 0.95);
    panelBg.fillRect(-180, -120, 360, 240);
    panelBg.lineStyle(2, building.color, 1);
    panelBg.strokeRect(-180, -120, 360, 240);

    const title = this.add.text(-160, -100, building.name.toUpperCase(), {
      font: 'bold 16px Courier',
      fill: '#ffffff'
    });

    const info = this.add.text(-160, -60, 
      `LEVEL: ${building.level}\n` +
      `INCOME: +$${building.income * (building.level || 1)}S / tick\n` +
      `PC CONTROL: +${building.pcBoost}%\n` +
      `MOBILE NETWORK: +${building.mobileBoost}%`, {
      font: '13px Courier',
      fill: '#88aacc',
      lineSpacing: 6
    });

    const upgradeCost = building.cost * (building.level + 1);
    const canAfford = this.money >= upgradeCost;

    const btnBg = this.add.graphics();
    btnBg.fillStyle(canAfford ? 0x00f0ff : 0x223344, 1);
    btnBg.fillRect(-160, 40, 320, 40);

    const btnText = this.add.text(-140, 52, `UPGRADE / BUY ($${upgradeCost}S)`, {
      font: 'bold 14px Courier',
      fill: canAfford ? '#000000' : '#888888'
    });

    const btnZone = this.add.zone(-160, 40, 320, 40).setOrigin(0).setInteractive({ useHandCursor: true });
    btnZone.on('pointerdown', () => this.buyBuildingUpgrade(building, upgradeCost));

    const closeBtn = this.add.text(150, -110, '✕', {
      font: '18px Courier',
      fill: '#ffffff'
    }).setInteractive({ useHandCursor: true });

    closeBtn.on('pointerdown', () => {
      sfx.playClickSound();
      this.panelContainer.destroy();
    });

    this.panelContainer = this.add.container(centerX, centerY, [
      panelBg, title, info, btnBg, btnText, btnZone, closeBtn
    ]);
  }

  buyBuildingUpgrade(building, cost) {
    if (this.money >= cost) {
      this.money -= cost;
      building.level += 1;
      this.pcPercent = Math.min(100, this.pcPercent + building.pcBoost);
      this.mobilePercent = Math.min(100, this.mobilePercent + building.mobileBoost);

      // Play Sound FX
      sfx.playUpgradeSound();

      // Trigger Neon Particle Burst on Building
      this.emitter.explode(25, building.isoX, building.isoY - building.h);

      this.updateHUDText();
      this.panelContainer.destroy();
      this.scene.restart();
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: 1000,
  height: 600,
  parent: 'game-container',
  scene: [CityManagerScene]
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
